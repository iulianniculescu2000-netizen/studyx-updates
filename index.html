<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyX</title>
  <meta name="description" content="Descarca StudyX pentru Windows.">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7fb;
      color: #151824;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background:
        linear-gradient(135deg, rgba(30, 96, 145, 0.14), transparent 42%),
        linear-gradient(315deg, rgba(41, 128, 108, 0.16), transparent 46%),
        #f6f7fb;
    }
    main {
      width: min(860px, 100%);
      display: grid;
      gap: 28px;
    }
    .hero {
      display: grid;
      gap: 18px;
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid rgba(21, 24, 36, 0.10);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.86);
      box-shadow: 0 24px 70px rgba(32, 45, 70, 0.14);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 800;
      font-size: 18px;
    }
    .mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: #1e6091;
      color: white;
      font-weight: 900;
    }
    h1 {
      margin: 0;
      max-width: 720px;
      font-size: clamp(36px, 7vw, 72px);
      line-height: 0.98;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      max-width: 620px;
      color: #4c5567;
      font-size: clamp(17px, 2.4vw, 21px);
      line-height: 1.55;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding-top: 12px;
    }
    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 8px;
      background: #1e6091;
      color: white;
      text-decoration: none;
      font-weight: 800;
    }
    a.secondary {
      color: #1e6091;
      font-weight: 700;
      text-decoration: none;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: #606b7c;
      font-size: 14px;
    }
    .meta span {
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.70);
      border: 1px solid rgba(21, 24, 36, 0.08);
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="brand">
        <div class="mark">S</div>
        <span>StudyX</span>
      </div>
      <h1 id="title">Invata mai organizat pentru grile.</h1>
      <p>StudyX este aplicatia pentru grile, recapitulare, flashcarduri, statistici si asistenta AI, pregatita pentru Windows.</p>
      <div class="actions">
        <a class="button" href="https://github.com/iulianniculescu2000-netizen/studyx-updates/releases/download/v1.0.0/StudyX-Setup-1.0.0.exe">Descarca StudyX</a>
        <a class="secondary" href="https://github.com/iulianniculescu2000-netizen/studyx-updates/releases/tag/v1.0.0">Vezi release-ul</a>
      </div>
      <div class="meta">
        <span>Versiune 1.0.0</span>
        <span>Windows x64</span>
        <span>Installer: 133 MB</span>
      </div>
    </section>
  </main>
</body>
</html>
